<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" role="img" aria-labelledby="whyUsTitle">
  <title id="whyUsTitle">Illustration of a house with plumbing running through it, marked with a licensed &amp; insured badge</title>
  <defs>
    <linearGradient id="whyUsBlob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15130F"/>
      <stop offset="100%" stop-color="#2A241A"/>
    </linearGradient>
  </defs>

  <rect x="20" y="20" width="480" height="480" rx="32" fill="url(#whyUsBlob)"/>

  <!-- house -->
  <g transform="translate(90,120)">
    <path d="M0 170 V90 L170 0 L340 90 V170" fill="none" stroke="#F3DFA0" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="20" y="170" width="300" height="150" rx="6" fill="none" stroke="#F3DFA0" stroke-width="10"/>
    <rect x="150" y="230" width="70" height="90" rx="4" fill="#E8B923"/>

    <!-- pipe run inside the house -->
    <path d="M60 320 V240 Q60 220 80 220 H240 Q260 220 260 200 V190"
          fill="none" stroke="#2F7DE1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <circle cx="60" cy="320" r="8" fill="#2F7DE1"/>
  </g>

  <!-- shield badge -->
  <g transform="translate(330,300)">
    <path d="M60 0 L112 20 V64 C112 100 88 124 60 136 C32 124 8 100 8 64 V20 Z" fill="#E8B923" stroke="#15130F" stroke-width="4"/>
    <path d="M34 66 L52 84 L90 42" fill="none" stroke="#15130F" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
